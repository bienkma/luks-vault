name: CI

on:
  push:
    branches:
      - main
      - 'features/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify module files
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is out of date. Run 'go mod tidy' locally and commit the result."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Run go vet
        run: go vet ./...

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build linux binary
        run: make build-linux GOARCH=${{ matrix.goarch }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: luks-vault-linux-${{ matrix.goarch }}
          path: dist/luks-vault
          if-no-files-found: error

  package:
    name: Package (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install nfpm
        run: make install-nfpm

      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          make package GOARCH=${{ matrix.goarch }} VERSION="$VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: luks-vault-packages-${{ matrix.goarch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: package
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download amd64 packages
        uses: actions/download-artifact@v4
        with:
          name: luks-vault-packages-amd64
          path: dist/amd64

      - name: Download arm64 packages
        uses: actions/download-artifact@v4
        with:
          name: luks-vault-packages-arm64
          path: dist/arm64

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/amd64/*
            dist/arm64/*
          generate_release_notes: true
